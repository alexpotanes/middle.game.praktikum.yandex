name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      - name: Bootstrap packages
        run: yarn lerna bootstrap
      - name: Run ESLint
        run: yarn lint
      - name: Check formatting
        run: yarn prettier --check "**/*.{js,ts,jsx,tsx,css,json,md}"
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      - name: Bootstrap packages
        run: yarn lerna bootstrap
      - name: Build shared package
        run: yarn build:shared
      - name: Run tests
        run: yarn test
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      - name: Bootstrap packages
        run: yarn lerna bootstrap
      - name: Build shared package
        run: yarn build:shared
      - name: Type check
        run: yarn lerna run type-check
  test-migrations:
    name: Forum migrations (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forum_migrations_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: forum_migrations_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      - name: Bootstrap packages
        run: yarn lerna bootstrap
      - name: Build shared package
        run: yarn build:shared
      - name: Run migrations against real Postgres and check schema invariants
        run: yarn test:integration